<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Garaj - Tablou de obiecte</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: LightGoldenRodYellow;
            margin: 30px;
        }
        .container {
            background-color: DarkSlateGray;
            color: white;
            padding: 20px;
            border-radius: 10px;
            font-size: 130%;
        }
        input, button {
            padding: 6px;
            margin: 5px;
            font-size: 90%;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            background-color: white;
            color: black;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: SeaGreen;
            color: white;
        }
    </style>
    <script>
    function citesteGaraj() {
        var text = localStorage.getItem("garaj");
        return text ? JSON.parse(text) : [];
    }

    function afiseazaGaraj() {
        var garaj = citesteGaraj();
        document.getElementById("numarMasini").innerHTML = "Număr de mașini în garaj: <b>" + garaj.length + "</b>";

        if (garaj.length === 0) {
            document.getElementById("tabelGaraj").innerHTML = "";
            return;
        }

        var html = "<table><tr><th>#</th><th>Tip</th><th>Model</th><th>Culoare</th><th>An fabricație</th><th>Acțiune</th></tr>";
        for (var i = 0; i < garaj.length; i++) {
            html += "<tr>" +
                "<td>" + (i + 1) + "</td>" +
                "<td>" + garaj[i].tip + "</td>" +
                "<td>" + garaj[i].model + "</td>" +
                "<td>" + garaj[i].culoare + "</td>" +
                "<td>" + garaj[i].anFab + "</td>" +
                "<td><button type='button' onclick='stergeMasina(" + i + ")'>Șterge</button></td>" +
                "</tr>";
        }
        html += "</table>";
        document.getElementById("tabelGaraj").innerHTML = html;
    }

    function adaugaMasina() {
        var garaj = citesteGaraj();
        var m = {
            tip: document.getElementById("tip").value,
            model: document.getElementById("model").value,
            culoare: document.getElementById("culoare").value,
            anFab: Number(document.getElementById("anFab").value)
        };
        garaj.push(m);
        localStorage.setItem("garaj", JSON.stringify(garaj));
        document.getElementById("formGaraj").reset();
        afiseazaGaraj();
        return false;
    }

    function stergeMasina(index) {
        var garaj = citesteGaraj();
        garaj.splice(index, 1);
        localStorage.setItem("garaj", JSON.stringify(garaj));
        afiseazaGaraj();
    }
    </script>
</head>
<body onload="afiseazaGaraj()">

<div class="container">
    <h2>Garaj (Local Storage)</h2>
    <form id="formGaraj" onsubmit="return adaugaMasina()">
        <label for="tip">Tip:</label> <input id="tip" required>
        <label for="model">Model:</label> <input id="model" required>
        <label for="culoare">Culoare:</label> <input id="culoare" required>
        <label for="anFab">An fabricație:</label> <input type="number" id="anFab" required>
        <button type="submit">Adaugă în garaj</button>
    </form>

    <p id="numarMasini"></p>
    <div id="tabelGaraj"></div>
</div>

</body>
</html>
